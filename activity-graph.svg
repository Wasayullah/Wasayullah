from pathlib import Path
from datetime import date, timedelta

# Standalone, self-contained SVG matching the requested React-dark activity-graph style.
# Since a static SVG cannot fetch GitHub's private/current contribution data by itself,
# this version is a clean reusable graph shell with representative activity bars.
W, H = 1200, 320
left, right, top, bottom = 60, 35, 65, 55
chart_w, chart_h = W-left-right, H-top-bottom

# 31 days × 7 contribution rows
days = 31
cols, rows = days, 7
gap = 5
cell_w = (chart_w - (cols-1)*gap) / cols
cell_h = (chart_h - (rows-1)*gap) / rows

# Deterministic illustrative values; clearly labeled in the SVG metadata.
vals = [
    [0,1,2,0,3,1,0,2,4,1,0,3,2,1,4,2,0,1,3,5,2,1,0,2,4,1,3,0,2,1,4],
    [1,2,0,1,2,3,1,0,3,2,1,4,0,2,3,1,2,0,4,2,1,3,2,0,1,4,2,1,3,0,2],
    [2,0,1,3,1,2,0,4,2,1,3,2,0,1,4,2,3,1,0,2,4,1,2,3,0,2,1,4,2,1,3],
    [0,1,3,2,4,1,2,0,1,3,2,4,1,0,2,3,1,4,2,0,3,1,2,4,1,3,0,2,4,1,2],
    [3,1,0,2,1,4,2,1,3,0,2,4,1,2,0,3,2,1,4,2,0,1,3,2,4,1,0,3,2,1,4],
    [1,3,2,0,1,2,4,1,0,3,2,1,4,2,0,1,3,2,4,1,2,0,3,1,2,4,1,0,2,3,1],
    [0,2,1,4,2,0,3,1,2,4,1,0,2,3,1,4,2,1,0,3,2,4,1,2,0,3,1,4,2,0,3],
]

# React-dark inspired palette.
levels = ["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"]

def esc(s):
    return (s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
             .replace('"',"&quot;").replace("'","&apos;"))

svg = [f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}"
viewBox="0 0 {W} {H}" role="img" aria-labelledby="title desc">
<title id="title">Wasayullah GitHub Activity Graph</title>
<desc id="desc">Standalone GitHub activity graph in a dark theme. The contribution cells are illustrative and should be replaced by generated GitHub activity data for live accuracy.</desc>
<rect width="100%" height="100%" rx="12" fill="#0d1117"/>
<text x="{left}" y="34" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif"
font-size="20" font-weight="600">Wasayullah&apos;s GitHub Activity Graph</text>''']

# Month/day labels
for i, label in enumerate(["Jun", "Jul", "Aug"]):
    x = left + i * (chart_w/3)
    svg.append(f'<text x="{x:.1f}" y="58" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">{label}</text>')

for r in range(rows):
    for c in range(cols):
        v = vals[r][c]
        level = min(4, v)
        x = left + c*(cell_w+gap)
        y = top + r*(cell_h+gap)
        svg.append(f'<rect x="{x:.2f}" y="{y:.2f}" width="{cell_w:.2f}" height="{cell_h:.2f}" rx="2.5" fill="{levels[level]}"/>')

# Legend
legend_y = H - 28
svg.append(f'<text x="{left}" y="{legend_y}" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">Less</text>')
for i, color in enumerate(levels):
    x = left + 38 + i*18
    svg.append(f'<rect x="{x}" y="{legend_y-10}" width="12" height="12" rx="2" fill="{color}"/>')
svg.append(f'<text x="{left+140}" y="{legend_y}" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">More</text>')

svg.append('</svg>')
content = "\n".join(svg)

path = Path("/mnt/data/activity-graph.svg")
path.write_text(content, encoding="utf-8")
print(path)
